<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ticket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎫 E-Ticket</h1>

    <div class="ticket">

        <p><strong>PNR:</strong> <span id="pnr"></span></p>
        <p><strong>Name:</strong> <span id="tname"></span></p>
        <p><strong>Age:</strong> <span id="tage"></span></p>
        <p><strong>From:</strong> Chennai Central</p>
        <p><strong>To:</strong> Mumbai CSMT</p>
        <p><strong>Train:</strong> Mumbai Mail (11028)</p>
        <p><strong>Date:</strong> <span id="tdate"></span></p>
        <p><strong>Class:</strong> Sleeper</p>

        <h3 class="confirmed">✔ Booking Confirmed</h3>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
